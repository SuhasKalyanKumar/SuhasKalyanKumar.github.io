<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Suhas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root {
    --paper: #14181a;
    --ink: #ecefee;
    --ink-soft: #93a09f;
    --line: #2a3134;
    --amber: #dc9a3e;
    --amber-soft: #4a3a20;
    --measure: 640px;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    font-size: 17px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  a { color: var(--ink); }

  ::selection { background: var(--amber-soft); }

  :focus-visible {
    outline: 2px solid var(--amber);
    outline-offset: 3px;
  }

  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 28px;
  }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 28px 0;
  }

  header.top .mark {
    font-family: 'Fraunces', serif;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: -0.01em;
  }

  nav.top-links {
    display: flex;
    gap: 28px;
    font-size: 14px;
    color: var(--ink-soft);
  }

  nav.top-links a {
    text-decoration: none;
    position: relative;
  }

  nav.top-links a::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: -4px;
    height: 1px;
    background: var(--amber);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.25s ease;
  }

  nav.top-links a:hover::after,
  nav.top-links a:focus-visible::after { transform: scaleX(1); }

  main { display: block; }

  /* HERO */
  .hero {
    padding: 56px 0 40px;
  }

  .hero h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: clamp(2.4rem, 5.4vw, 3.6rem);
    line-height: 1.08;
    letter-spacing: -0.015em;
    margin: 0 0 20px;
    max-width: 14ch;
  }

  .hero p.sub {
    max-width: var(--measure);
    color: var(--ink-soft);
    font-size: 18px;
    margin: 0 0 34px;
  }

  .hero p.sub strong { color: var(--ink); font-weight: 500; }

  /* wave / mesh divider — the one motion moment */
  .signal {
    width: 100%;
    max-width: 460px;
    height: 64px;
    display: block;
  }

  .signal path {
    fill: none;
    stroke: var(--ink);
    stroke-width: 1.4;
    stroke-linecap: round;
    stroke-dasharray: 620;
    stroke-dashoffset: 620;
    animation: draw 1.4s ease forwards 0.15s;
  }

  .signal circle {
    fill: var(--amber);
    opacity: 0;
    animation: pop 0.4s ease forwards;
  }

  @keyframes draw {
    to { stroke-dashoffset: 0; }
  }

  @keyframes pop {
    to { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .signal path { animation: none; stroke-dashoffset: 0; }
    .signal circle { animation: none; opacity: 1; }
  }

  /* SECTIONS */
  section {
    padding: 44px 0;
    border-top: 1px solid var(--line);
  }

  section .label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  section h2 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.5rem;
    margin: 0 0 18px;
    letter-spacing: -0.01em;
  }

  .about p {
    max-width: var(--measure);
    color: var(--ink-soft);
  }

  .about p strong { color: var(--ink); font-weight: 500; }

  /* PROJECTS */
  .project {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 22px 0;
    border-top: 1px solid var(--line);
    position: relative;
  }

  .project:first-of-type { border-top: none; padding-top: 0; }

  .project-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
  }

  .project-head h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
    margin: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .project-head h3 .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--amber);
    opacity: 0;
    transform: scale(0.4);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .project:hover h3 .dot,
  .project:focus-within h3 .dot {
    opacity: 1;
    transform: scale(1);
  }

  .project-head time {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .project p {
    max-width: var(--measure);
    color: var(--ink-soft);
    margin: 4px 0 0;
  }

  .stack {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* CURRENTLY */
  .now {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    max-width: var(--measure);
  }

  .now .indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--amber);
    margin-top: 7px;
    flex-shrink: 0;
    animation: breathe 2.4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .now .indicator { animation: none; }
  }

  .now p { color: var(--ink-soft); margin: 0; }
  .now p strong { color: var(--ink); font-weight: 500; }

  /* CONTACT */
  .contact-links {
    display: flex;
    flex-wrap: wrap;
    gap: 22px 30px;
  }

  .contact-links a {
    text-decoration: none;
    font-size: 15px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding-bottom: 2px;
    border-bottom: 1px solid var(--line);
    transition: border-color 0.2s ease;
  }

  .contact-links a:hover,
  .contact-links a:focus-visible {
    border-color: var(--amber);
  }

  footer {
    padding: 30px 0 50px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  @media (max-width: 560px) {
    header.top { flex-direction: column; align-items: flex-start; gap: 14px; }
    .project-head { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="mark">Suhas</div>
    <nav class="top-links">
      <a href="#contact">Contact</a>
    </nav>
  </header>

  <main>
    <section class="hero" style="border-top:none; padding-top:8px;">
      <h1>Hi, I'm Suhas.</h1>

      <svg class="signal" viewBox="0 0 460 64" aria-hidden="true">
        <path d="M4,32 L60,32 L90,10 L120,54 L150,20 L180,44 L210,32 L260,32 L290,14 L320,50 L350,24 L380,40 L410,32 L456,32" />
        <circle cx="90" cy="10" r="3" style="animation-delay:0.4s"/>
        <circle cx="150" cy="20" r="3" style="animation-delay:0.6s"/>
        <circle cx="290" cy="14" r="3" style="animation-delay:0.9s"/>
        <circle cx="350" cy="24" r="3" style="animation-delay:1.1s"/>
      </svg>
    </section>

    <section class="about">
      <p class="label">about</p>
      <p>I'm Suhas, 19, currently doing a BSc in Artificial Intelligence and Machine Learning at the University of Limerick. Outside of that I like programming, solving puzzles, watching movies, and playing football.</p>
    </section>

    <section id="contact">
      <p class="label">contact</p>
      <div class="contact-links">
        <a href="mailto:suhaskalyanrgb@gmail.com">Email →</a>
        <a href="https://github.com/SuhasKalyanKumar" target="_blank" rel="noopener">GitHub →</a>
      </div>
    </section>
  </main>

  <footer>
    Built and hosted by Suhas.
  </footer>
</div>

</body>
</html>
